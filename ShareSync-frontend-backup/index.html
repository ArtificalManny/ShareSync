<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ShareSync</title>

    <!-- SEO -->
    <meta
      name="description"
      content="ShareSync — plan projects, track daily goals, and celebrate team progress with a public cadence feed."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- PWA-ish basics -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Early theme boot (prevents flash of wrong theme) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ss.theme') || 'system';
          var root = document.documentElement;
          var setDark = function (isDark) {
            root.classList.toggle('dark', !!isDark);
            root.dataset.theme = isDark ? 'dark' : 'light';
          };
          if (t === 'dark') setDark(true);
          else if (t === 'light') setDark(false);
          else if (window.matchMedia) {
            setDark(window.matchMedia('(prefers-color-scheme: dark)').matches);
          } else {
            setDark(false);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts (preload + stylesheet) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!-- Skip link should be first focusable element -->
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:top-3 focus:left-3 focus:bg-white focus:text-slate-900 focus:px-3 focus:py-2 focus:rounded-md focus:ring-2"
    >
      Skip to main content
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
