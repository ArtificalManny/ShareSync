    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#a855f7" />

    <link rel="apple-touch-startup-image" href="/splash/iphone5_splash.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/splash/iphone6_splash.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/splash/iphonex_splash.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('ss.theme') || 'system';
          var root = document.documentElement;
          var setDark = function (isDark) {
            root.classList.toggle('dark', !!isDark);
            root.dataset.theme = isDark ? 'dark' : 'light';
          };
          if (t === 'dark') setDark(true);
          else if (t === 'light') setDark(false);
          else if (window.matchMedia) {
            setDark(window.matchMedia('(prefers-color-scheme: dark)').matches);
          } else {
            setDark(false);
          }
        } catch (e) {}
      })();
    </script>

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>

  <body>
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:top-3 focus:left-3 focus:bg-white focus:text-slate-900 focus:px-3 focus:py-2 focus:rounded-md focus:ring-2"
    >
      Skip to main content
    </a>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var isLocalhost =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname.endsWith('.local');

        if (!isLocalhost && 'serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js')
              .then(function (registration) {
                console.log('[SW] Registered:', registration.scope);
                setInterval(function () {
                  registration.update();
                }, 60 * 60 * 1000);
              })
              .catch(function (error) {
                console.error('[SW] Registration failed:', error);
              });
          });
        }
      })();
    </script>
  </body>
</html>
