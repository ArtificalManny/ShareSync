name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ShareSync-frontend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ShareSync-frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./ShareSync-frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ShareSync-backend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ShareSync-backend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm test -- --coverage --watchAll=false
    
    - name: Run integration tests
      run: npm run test:integration -- --forceExit
      env:
        JWT_SECRET: test-secret-for-ci
        MONGODB_URI: mongodb://localhost:27017/test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./ShareSync-backend/coverage/coverage-final.json
        flags: backend
        name: backend-coverage

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Install frontend dependencies
      working-directory: ./ShareSync-frontend
      run: npm ci
    
    - name: Install backend dependencies
      working-directory: ./ShareSync-backend
      run: npm ci
    
    - name: Lint frontend
      working-directory: ./ShareSync-frontend
      run: npm run lint --if-present || echo "No lint script"
    
    - name: Lint backend
      working-directory: ./ShareSync-backend
      run: npm run lint --if-present || echo "No lint script"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Install frontend dependencies
      working-directory: ./ShareSync-frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./ShareSync-frontend
      run: npm run build
    
    - name: Install backend dependencies
      working-directory: ./ShareSync-backend
      run: npm ci
    
    - name: Build backend
      working-directory: ./ShareSync-backend
      run: npm run build
